[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=tests/reports/allure-results
    -m "not load"
    # Примечание: slow тесты включены, но test_get_vehicle_maintenances_all
    # отключен по умолчанию через переменную окружения ENABLE_HEAVY_TESTS
markers =
    unit: быстрые модульные тесты/заглушки без внешних зависимостей
    api: интеграционные API-тесты
    ui: UI/E2E тесты через браузер
    smoke: быстрый дымовой прогон
    regression: регрессионный набор
    slow: тяжёлые или долгие тесты
    integration: интеграционные сценарии
    e2e: сквозные сценарии
    requires_auth: тесты, требующие авторизации
    load: нагрузочные/ресурсоёмкие проверки (запускаются отдельно!)
    security: проверки безопасности
