############################################
# Application
############################################
spring.application.name=JwtTicTacToe

# Default user (example values)
default.user.login=myserver
default.user.password=123456

############################################
# Server (HTTP/HTTPS + SSL)
############################################
#server.port=8080  # Uncomment to run on HTTP
server.port=8443

# SSL configuration
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-alias=myserver
server.ssl.key-store-password=123456
server.ssl.key-password=123456

############################################
# JWT Configuration
############################################
jwt.secret=may-very-super-secret-jwt-key-with-minimum-32-chars-length-here
jwt.access.expiration=3600000
# 1 hour
jwt.refresh.expiration=2592000000
# 30 days

############################################
# Swagger / OpenAPI
############################################
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/api-docs

############################################
# JSON / Jackson
############################################
spring.jackson.serialization.indent-output=true

############################################
# Logging
############################################
#logging.file.name=application.log
#logging.level.root=INFO
#logging.level.org.springframework=DEBUG
#logging.level.example=DEBUG
#logging.level.org.flywaydb=DEBUG

############################################
# Database (PostgreSQL)
############################################
spring.datasource.url=jdbc:postgresql://localhost:5432/tictactoe_db
spring.datasource.username=java_user
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / Hibernate
############################################
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

############################################
# Flyway (DB migrations)
############################################
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:migration
spring.flyway.baseline-on-migrate=true

############################################
# Connection Pool (HikariCP)
############################################
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
