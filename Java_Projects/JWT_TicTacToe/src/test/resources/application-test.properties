# Тестовая конфигурация для JWT TicTacToe приложения

# База данных для тестов (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT настройки для тестов
jwt.secret=test-secret-key-for-jwt-token-generation-minimum-256-bits-long-for-security
jwt.access.expiration=3600000
jwt.refresh.expiration=2592000000

# Отключаем миграции для тестов
spring.flyway.enabled=false

# Логирование для тестов
logging.level.example=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Отключаем баннер Spring Boot в тестах
spring.main.banner-mode=off

# Настройки безопасности для тестов
spring.security.debug=false







