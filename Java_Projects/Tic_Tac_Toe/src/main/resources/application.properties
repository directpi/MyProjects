spring.application.name=Tic Tac Toe

# Default user (for demo/initial setup - override in production)
default.user.login=${DEFAULT_USER_LOGIN:demo}
default.user.password=${DEFAULT_USER_PASSWORD:}

#server.port=8080

# Server
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SSL_ENABLED:false}

# SSL Configuration (only if enabled)
# Keystore should be provided externally
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-alias=${SSL_KEY_ALIAS:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-password=${SSL_KEY_PASSWORD:}
server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}

# Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/api-docs

spring.jackson.serialization.indent-output=true

spring.datasource.url=jdbc:postgresql://localhost:5432/tictactoe_db
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
