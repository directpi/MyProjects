############################################
# Application
############################################
app.version=${APP_VERSION}
# ВАЖНО: не используем APP_NAME напрямую, т.к. Gradle Wrapper (./gradlew) задаёт APP_NAME=Gradle
# и это ломает отображаемое имя сервиса при запуске через bootRun.
# Используйте SPRING_APPLICATION_NAME (скрипты прокидывают его из APP_NAME из .env).
spring.application.name=${SPRING_APPLICATION_NAME:api-service}
############################################
# Server (HTTP/HTTPS + SSL)
############################################
server.port=${SERVER_PORT}

############################################
# Swagger / OpenAPI
############################################
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger/index.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/api-docs

############################################
# JSON / Jackson
############################################
spring.jackson.serialization.indent-output=true

############################################
# Logging
############################################
# Logging levels
############################################
logging.level.root=INFO
logging.level.example=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

spring.config.import=optional:file:.env[.properties]


############################################
# Logging files
############################################
logging.file.name=logs/application.log

############################################
# Patterns
############################################
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

############################################
# Logger configuration
############################################
logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

############################################
# Database (PostgreSQL)
############################################
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# Flyway (DB migrations)
############################################
#spring.flyway.enabled=true
#spring.flyway.schemas=public
#spring.flyway.locations=classpath:migration
#spring.flyway.baseline-on-migrate=true

############################################
# Connection Pool (HikariCP)
############################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


############################################
# Actuator endpoints
############################################
management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always
  #when_authorized

management.info.env.enabled=true

############################################
# Spring Data JDBC
############################################
spring.sql.init.mode=embedded
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# ??? ?????????? - ????????? multipart
spring.servlet.multipart.resolve-lazily=false