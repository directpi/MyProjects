server {
    listen 80;
    server_name ecommerce.local localhost;
    
    client_max_body_size 10M;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    location ~* \.(jpg|jpeg|png|gif|webp|ico|mp4|webm|ogg|mp3|wav|flac|aac)$ {
        root $project_root/nginx/static;
        gzip off;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root $project_root/nginx/static;
        index index.html;
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /api {
        rewrite ^/api$ /api/v1 permanent;
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass http://backend_primary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1 {
        proxy_pass http://backend_write/swagger/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (редирект из /api/v1 ведёт сюда)
    location /swagger/ {
        proxy_pass http://backend_write;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v[12]/ {
        set $backend_pool backend_primary;
        set $cache_bypass 0;

        # Не кешируем write-запросы: они должны идти только на основной инстанс (8080)
        if ($request_method !~ ^(GET|HEAD)$) {
            set $backend_pool backend_write;
            set $cache_bypass 1;
        }

        # Не кешируем авторизованные/сессионные запросы (безопаснее по умолчанию)
        if ($http_authorization != "") {
            set $cache_bypass 1;
        }
        if ($http_cookie != "") {
            set $cache_bypass 1;
        }

        proxy_pass http://$backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Кешируем только GET/HEAD на /api/v1/* и /api/v2/* (кроме случаев выше)
        proxy_cache static_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;

        # Для диагностики балансировки: покажем, какой upstream ответил
        add_header X-Upstream $upstream_addr always;

        # ВАЖНО: бекенд может возвращать Cache-Control/Expires, которые запрещают кеширование.
        # Для выполнения задания (кешировать все GET, кроме /api) игнорируем эти заголовки у upstream.
        proxy_ignore_headers Cache-Control Expires;

        proxy_cache_bypass $cache_bypass;
        proxy_no_cache $cache_bypass;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /admin {
        proxy_pass http://localhost:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 443 ssl;
    server_name ecommerce.local;

    client_max_body_size 10M;
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    ssl_certificate     /etc/nginx/ssl/ecommerce.local.crt;
    ssl_certificate_key /etc/nginx/ssl/ecommerce.local.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

