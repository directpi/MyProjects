############################################
# Application
############################################
spring.application.name=BrickGameApplication

############################################
# Server (HTTP/HTTPS + SSL)
############################################
# HTTP mode for development
server.port=8080
# HTTPS mode (requires keystore.jks)
#server.port=8443

# SSL configuration (disabled for development)
#server.ssl.key-store=classpath:keystore.jks
#server.ssl.key-alias=myserver
#server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
#server.ssl.key-password=${SSL_KEY_PASSWORD:}

############################################
# Swagger / OpenAPI
############################################
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/api-docs

############################################
# JSON / Jackson
############################################
spring.jackson.serialization.indent-output=true
spring.jackson.property-naming-strategy=SNAKE_CASE

############################################
# Logging
############################################
#logging.file.name=application.log
#logging.level.root=INFO
#logging.level.org.springframework=DEBUG
#logging.level.example=DEBUG
#logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
############################################
# Static Resources
############################################
# Serve static content (web GUI and assets)
spring.web.resources.add-mappings=true
# Use only classpath-lovation, external path web_gui switchet off
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
# Enable resource chain and content-based versioning for cache busting
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
# Cache headers
spring.web.resources.cache.period=86400

############################################
# CORS (Development defaults)
############################################
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,https://localhost:8443}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Content-Type,Authorization}
spring.web.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
spring.web.cors.max-age=3600

############################################
# Security (Dev defaults)
############################################
# Keep public API for local dev; set to false for prod and configure authentication.
brickgame.security.public-api=true
# Disable Basic Auth prompt by default.
brickgame.security.http-basic=false

############################################
# HTTP Response Compression
############################################
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

############################################
# HTTP/2 (disabled for HTTP mode)
############################################
#server.http2.enabled=true  # Only works with SSL

############################################
# Connection Pool (HikariCP)
############################################
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

############################################
# Logging tweaks to reduce warning noise
############################################
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

